name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build id
        required: true
      build_ref:
        description: Branch holding the generated Android project
        required: true
      callback_url:
        description: Status callback base URL
        required: true
      callback_token:
        description: Per-build callback token
        required: true

concurrency:
  group: apk-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask secrets
        run: echo "::add-mask::${{ inputs.callback_token }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}

      - name: Report queued
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}/status" \
            -H "content-type: application/json" \
            -H "x-build-token: ${{ inputs.callback_token }}" \
            -d '{"build_id":"${{ inputs.build_id }}","stage":"project","status":"running","message":"Runner acquired"}' || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}/status" \
            -H "content-type: application/json" -H "x-build-token: ${{ inputs.callback_token }}" \
            -d '{"build_id":"${{ inputs.build_id }}","stage":"dependencies","status":"success","message":"JDK 17 + Android SDK ready"}' || true

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate launcher icons
        run: |
          set -e
          cd project
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          SRC=icon.png
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!SIZES[@]}"; do
            S=${SIZES[$d]}
            OUT=app/src/main/res/mipmap-$d
            mkdir -p "$OUT"
            convert "$SRC" -resize ${S}x${S}^ -gravity center -extent ${S}x${S} "$OUT/ic_launcher.png"
            convert "$OUT/ic_launcher.png" \
              \( +clone -alpha extract -draw "fill black polygon 0,0 0,$S $S,0 fill white circle $((S/2)),$((S/2)) $((S/2)),0" \
                 \( +clone -flip \) -compose Multiply -composite \
                 \( +clone -flop \) -compose Multiply -composite \
              \) -alpha off -compose CopyOpacity -composite "$OUT/ic_launcher_round.png"
            FS=$((S * 3 / 2))
            convert "$SRC" -resize $((S*2/3))x$((S*2/3))^ -gravity center -background none -extent ${FS}x${FS} "$OUT/ic_launcher_foreground.png"
          done
          curl -sS -X POST "${{ inputs.callback_url }}/status" \
            -H "content-type: application/json" -H "x-build-token: ${{ inputs.callback_token }}" \
            -d '{"build_id":"${{ inputs.build_id }}","stage":"icons","status":"success","message":"Launcher icons generated"}' || true

      - name: Create signing keystore
        run: |
          set -e
          cd project
          keytool -genkeypair -v -keystore release.keystore -alias appkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.build_id }}" -keypass "${{ inputs.build_id }}" \
            -dname "CN=Website to APK Converter, OU=Zain Developer, O=Zain Developer, C=US"
          curl -sS -X POST "${{ inputs.callback_url }}/status" \
            -H "content-type: application/json" -H "x-build-token: ${{ inputs.callback_token }}" \
            -d '{"build_id":"${{ inputs.build_id }}","stage":"sign","status":"success","message":"Keystore generated"}' || true

      - name: Gradle build
        id: gradle
        run: |
          set -o pipefail
          cd project
          curl -sS -X POST "${{ inputs.callback_url }}/status" \
            -H "content-type: application/json" -H "x-build-token: ${{ inputs.callback_token }}" \
            -d '{"build_id":"${{ inputs.build_id }}","stage":"assemble","status":"running","message":"Compiling Android application"}' || true
          gradle --no-daemon assembleRelease 2>&1 | tail -n 400

      - name: Sign and verify APK
        id: sign
        run: |
          set -e
          cd project
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          TOOLS="$ANDROID_HOME/build-tools/$BT"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks release.keystore --ks-key-alias appkey \
            --ks-pass pass:"${{ inputs.build_id }}" --key-pass pass:"${{ inputs.build_id }}" \
            --out app-release.apk aligned.apk
          "$TOOLS/apksigner" verify --verbose app-release.apk
          SIZE=$(stat -c%s app-release.apk)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -lt 200000 ]; then echo "APK suspiciously small"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.build_id }}
          path: project/app-release.apk
          retention-days: 7

      - name: Upload APK to app storage
        run: |
          set -e
          cd project
          curl -sS --fail -X POST "${{ inputs.callback_url }}/artifact" \
            -H "x-build-token: ${{ inputs.callback_token }}" \
            -H "x-build-id: ${{ inputs.build_id }}" \
            -H "content-type: application/vnd.android.package-archive" \
            --data-binary @app-release.apk

      - name: Report failure
        if: failure()
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}/status" \
            -H "content-type: application/json" -H "x-build-token: ${{ inputs.callback_token }}" \
            -d '{"build_id":"${{ inputs.build_id }}","stage":"assemble","status":"failed","message":"Build failed. See the GitHub Actions run log for details."}' || true
