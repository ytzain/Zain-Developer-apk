name: build-apk

run-name: build-apk ${{ github.event.client_payload.build_id }}

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack generated project
        run: |
          mkdir -p build-src
          unzip -q "builds/${{ github.event.client_payload.build_id }}/project.zip" -d build-src
          ls -R build-src | head -50
      - name: Build APK
        run: gradle -p build-src assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          find build-src -name "*.apk" -exec cp {} out/app.apk \;
          ls -la out
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.client_payload.build_id }}
          path: out/app.apk
          retention-days: 7
